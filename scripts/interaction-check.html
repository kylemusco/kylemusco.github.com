<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy customization checks</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/scripts/interaction-check.mjs"></script>
  </head>
  <body>
    <div class="galaxy-backdrop" aria-hidden="true" inert>
      <div id="galaxy"></div>
    </div>
    <div id="root"><!--app-html--></div>
    <details
      style="
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 6;
        max-height: 40vh;
        overflow: auto;
        background: #080e19;
        padding: 12px;
        font-size: 11px;
        max-width: 340px;
      "
      data-galaxy-controls
    >
      <summary>Interaction diagnostics</summary>
      <pre id="interaction-result" role="status"></pre>
    </details>
  </body>
</html>
