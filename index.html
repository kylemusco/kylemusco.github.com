<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050811" />
    <title>Kyle Musco | Senior iOS Engineer</title>
    <meta
      name="description"
      content="Kyle Musco, Senior iOS Engineer at ForeFlight. View my resume and GitHub, set against a spiral galaxy."
    />
    <link rel="canonical" href="https://www.kylemusco.com/" />
    <meta property="og:url" content="https://www.kylemusco.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kyle Musco | Senior iOS Engineer" />
    <meta
      property="og:description"
      content="Senior iOS Engineer at ForeFlight. View my resume and GitHub."
    />
    <meta
      property="og:image"
      content="https://www.kylemusco.com/images/metaimage.png"
    />
    <meta
      property="og:image:alt"
      content="A spiral galaxy on Kyle Musco's personal website"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/images/space_icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.tsx"></script>
    <!-- Only the legacy renderer still needs jQuery; replace it in steps 4–5. -->
    <script
      defer
      src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"
    ></script>
    <script defer src="/js/three.min.js"></script>
    <script defer src="/js/space.js"></script>
    <script defer src="/js/galaxy.js"></script>
  </head>
  <body>
    <div class="galaxy-backdrop" aria-hidden="true" inert>
      <div id="space"></div>
      <div id="galaxy"></div>
    </div>
    <div id="root"><!--app-html--></div>
    <script id="vShader" type="x-vertex/x-shader">
      uniform float size;
      uniform float t;
      uniform float z;
      uniform float pixelRatio;

      varying vec3 vPosition;
      varying vec3 mPosition;
      varying float gas;

      float a,b=0.;

      void main(){
        vPosition=position;

        a=length(position);
        if(t>0.)b=max(0.,(cos(a/20.-t*.02)-.99)*3./a);
        if(z>0.)b=max(0.,cos(a/40.-z*.01+2.));
        mPosition=position*(1.+b*4.);
        vec4 mvPosition=modelViewMatrix*vec4(mPosition,1.);
        gl_Position=mvPosition*projectionMatrix;

        gas=max(.0,sin(-a/80.));
        gl_PointSize=pixelRatio*size*(1.+gas*2.)/length(mvPosition.xyz);

      }
    </script>
    <script id="fShader" type="x-fragment/x-shader">
      uniform float z;

      varying vec3 vPosition;
      varying vec3 mPosition;
      varying float gas;

      void main(){
        float a=distance(mPosition,vPosition);
        if(a>0.)a=1.;

        float b=max(.32,.0065*length(vPosition));

        float c=distance(gl_PointCoord,vec2(.5));
        float starlook=-(c-.5)*1.2*gas;
        float gaslook=(1.-gas)/(c*10.5);
        float texture=starlook+gaslook;

        gl_FragColor=vec4(.35,.29,b,1.)*texture*(1.-a*.35);

        if(z>0.)gl_FragColor*=cos(1.5*z/322.)*(1.-.001*length(mPosition));
          }
    </script>
  </body>
</html>
